server {
  listen       80;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/javascript application/javascript
    application/json application/xml image/svg+xml font/woff2;

  # Long-cache hashed Next.js assets
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Static export: try literal path, .html sibling, then directory index, then 404
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  # No-cache for HTML so deploys propagate
  location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-store, must-revalidate";
  }

  error_page 404 /404.html;
}
